deck:
  title: ai-deck-compiler Showcase
  design: vivid
  theme: dark
  version: "1.1"
  audience: Product, Engineering, and AI Workflow Leads
  author: ai-deck-compiler

slides:
  - id: hero
    type: hero
    title: ai-deck-compiler
    subtitle: AI가 기획한 의미 구조를 editable PowerPoint로 컴파일하는 presentation engine
    cta: Semantic Blueprint Planning · Deterministic Rendering · Preset Showcase

  - id: agenda
    type: agenda
    title: 오늘 볼 것
    section_label: "00. AGENDA"
    items:
      - AI가 만든 PPT가 왜 다시 손봐야 하는 산출물이 되는가
      - blueprint-first workflow가 내용을 구조화하는 방식
      - 짧은 기간에 쌓은 compiler, skill, preset, example evidence
      - 같은 deck을 teal, vivid, modern preset으로 재생성하는 결과
      - 이 showcase 자체가 public proof artifact가 되는 이유

  - id: section-problem
    type: section-divider
    title: Why It Exists
    section: "01"
    number: "01"

  - id: problem-frame
    type: content
    title: AI가 만든 deck도 구조가 없으면 다시 수작업이 된다
    section_label: "01. PROBLEM"
    callout: "이 프로젝트의 목표는 ‘예쁜 초안’이 아니라 검증 가능하고 다시 생성 가능한 presentation artifact다."
    body:
      - 일반적인 AI slide 생성은 빠르지만, 내용의 의미 구조와 편집 가능한 객체 경계가 쉽게 사라진다.
      - 차트, 표, 아키텍처, 의사결정, 코드 예시는 모두 다른 표현 방식이 필요한데 bullet slide 하나로 눌리기 쉽다.
      - "`ai-deck-compiler`는 AI가 고른 표현 결정을 `blueprint.yaml`에 남기고, renderer가 PowerPoint 객체로 재현한다."
      - 검증 명령, preview 이미지, tracked result files가 산출물을 반복 가능한 작업 단위로 만든다.

  - id: artifact-contrast
    type: two-column
    title: Prompt output이 아니라 구조화된 artifact를 남긴다
    section_label: "01. CONTRAST"
    left:
      label: AI-only slide draft
      body:
        - 결과물이 이미지나 느슨한 bullet 묶음으로 남기 쉽다.
        - 같은 요청을 다시 실행하면 layout과 강조 수준이 흔들릴 수 있다.
        - 리뷰는 “보기 괜찮은가” 중심이라 수정 근거가 약하다.
        - 코드·명령어·재생성 절차가 일반 문장처럼 섞인다.
    right:
      label: Blueprint-first deck
      body:
        - slide type, chart data, diagram node, notes가 YAML에 보존된다.
        - 같은 blueprint와 preset이면 같은 rendering 규칙으로 재생성된다.
        - validate, deck, preview, review loop가 품질 게이트가 된다.
        - code block은 boxed monospace component로 분리해 보여준다.

  - id: semantic-comparison
    type: comparison
    title: 내용을 그대로 옮기지 않고 표현 방식을 선택한다
    section_label: "02. SEMANTIC PLANNING"
    left:
      label: Bullet translation
      body:
        - 수치, 결정, 구조, 절차가 모두 비슷한 bullet로 평평해진다.
        - 슬라이드 제목은 주제 라벨이 되고 결론은 본문에 묻힌다.
        - 차트나 diagram은 나중에 사람이 다시 설계해야 한다.
    right:
      label: Semantic blueprint
      body:
        - 숫자는 KPI/chart, 관계는 architecture, 순서는 flow로 승격한다.
        - action title, callout, recommendation, takeaways가 강조 계층을 만든다.
        - renderer는 의미 필드를 읽어 editable PPTX 객체로 출력한다.

  - id: capability-kpis
    type: kpi
    title: 작은 repo지만 deck 생성에 필요한 핵심 블록을 갖췄다
    section_label: "02. CAPABILITY"
    kpis:
      - label: Slide Types
        value: "16"
        delta: "core, data, diagram"
        trend: up
      - label: Tests
        value: "58"
        delta: "parser/render/snapshot"
        trend: up
      - label: Presets
        value: "3"
        delta: "teal/vivid/modern"
        trend: up
      - label: Result Files
        value: "10"
        delta: "blueprint/PPTX/PDF/gallery"
        trend: neutral

  - id: build-intensity
    type: chart
    title: 집중적인 구현이 compiler와 workflow를 동시에 밀어 올렸다
    section_label: "03. EVIDENCE"
    chart:
      type: bar
      data:
        source: inline
        labels: ["May 30", "May 31", "Jun 01"]
        series:
          - name: Non-merge commits
            values: [1, 24, 23]

  - id: codebase-shape
    type: chart
    title: 제품은 코드, skill, 예제, 문서를 함께 갖춘다
    section_label: "03. EVIDENCE"
    chart:
      type: bar
      data:
        source: inline
        labels: ["Engine src", "AI skills", "Examples", "Tests"]
        series:
          - name: Local LOC
            values: [4725, 1695, 1675, 901]

  - id: section-system
    type: section-divider
    title: How It Works
    section: "02"
    number: "02"

  - id: architecture
    type: architecture
    title: AI planning과 deterministic rendering을 분리한다
    section_label: "04. ARCHITECTURE"
    diagram:
      source: inline
      version: "1.0"
      nodes:
        - id: request
          kind: client
          label: User Request
          zone: center-left
        - id: skill
          kind: service
          label: create-deck Skill
          zone: top-center
        - id: blueprint
          kind: storage
          label: blueprint.yaml
          zone: center
        - id: tokens
          kind: database
          label: Preset Tokens
          zone: bottom-center
        - id: compiler
          kind: service
          label: Compiler + Registry
          zone: center-right
        - id: pptx
          kind: external
          label: Editable PPTX
          zone: bottom-right
      edges:
        - from: request
          to: skill
          kind: data-flow
          label: intent
        - from: skill
          to: blueprint
          kind: sync
          label: narrative + schema
        - from: blueprint
          to: compiler
          kind: sync
          label: validated DSL
        - from: tokens
          to: compiler
          kind: data-flow
          label: design system
        - from: compiler
          to: pptx
          kind: data-flow
          label: shapes + charts + text

  - id: create-flow
    type: flow
    title: 작성과 검토는 preview gate를 통과하며 반복된다
    section_label: "04. WORKFLOW"
    callout: "Preview는 자동 종료점이 아니라, 사람이 결과를 보고 조정하는 품질 게이트다."
    diagram:
      source: inline
      version: "1.0"
      nodes:
        - id: brief
          kind: client
          label: Brief or Source
          zone: center-left
        - id: plan
          kind: service
          label: Slide Plan
          zone: top-center
        - id: blueprint
          kind: storage
          label: Blueprint Draft
          zone: center
        - id: deck
          kind: external
          label: PPTX
          zone: center-right
        - id: preview
          kind: cloud
          label: Preview PNGs
          zone: bottom-center
        - id: review
          kind: service
          label: Review Loop
          zone: bottom-right
      edges:
        - from: brief
          to: plan
          kind: sync
          label: align
        - from: plan
          to: blueprint
          kind: sync
          label: write
        - from: blueprint
          to: deck
          kind: data-flow
          label: compile
        - from: deck
          to: preview
          kind: data-flow
        - from: preview
          to: review
          kind: sync
          label: inspect
        - from: review
          to: blueprint
          kind: async

  - id: preset-table
    type: table
    title: 같은 content, 세 가지 presentation tone
    section_label: "05. PRESETS"
    headers: ["Preset", "Theme", "Best fit", "What this showcase proves"]
    rows:
      - ["teal", "dark", "AI-native technical briefing", "차분한 executive tone과 callout bar"]
      - ["vivid", "dark", "Product demo / feature showcase", "강한 contrast와 vivid accent"]
      - ["modern", "light", "Business report / sharing doc", "office-friendly light document tone"]

  - id: development-timeline
    type: timeline
    title: 3일의 작업은 기능보다 workflow 완성에 집중됐다
    section_label: "06. TIMELINE"
    items:
      - date: "May 30"
        label: Engine baseline
        description: schema, renderer, CLI, metadata, preview 기반을 만들었다.
      - date: "May 31"
        label: AI workflow
        description: create/review/export skills와 사용자·시스템 문서를 정렬했다.
      - date: "Jun 01"
        label: Public proof
        description: presets, semantic planning, code block, showcase artifacts를 다듬었다.
      - date: "Next"
        label: Release gate
        description: AI tool simulation과 repo settings로 public 전환을 준비한다.

  - id: proof-decision
    type: decision
    title: 대표 예제는 제품 자체를 증명해야 한다
    section_label: "07. DECISION"
    options:
      - label: Generic business sample
        pros:
          - 누구나 익숙한 주제로 읽기 쉽다
          - 도메인 설명 부담이 낮다
        cons:
          - 이 repo가 왜 필요한지 첫 화면에서 충분히 말하지 못한다
          - preset, slide type, code block, workflow 증거가 분산된다
      - label: Product proof showcase
        pros:
          - 제품 메시지와 산출물 품질을 같은 deck에서 보여준다
          - chart, architecture, code block, preset 비교가 맥락 안에 놓인다
        cons:
          - content 품질 기준이 일반 sample보다 높아진다
    recommendation: examples/results는 generic sample이 아니라 ai-deck-compiler 자체를 설명하는 product proof artifact로 둔다.

  - id: summary
    type: summary
    title: 이 deck은 제품 설명이자 출력 품질 검증이다
    section_label: "08. TAKEAWAYS"
    body:
      - AI는 발표 목적, 청중, source를 읽고 slide type과 강조 계층을 결정한다.
      - Compiler는 blueprint와 preset token을 읽어 chart, table, diagram, code block을 PowerPoint 객체로 만든다.
      - Preview와 review loop는 “생성됨”에서 멈추지 않고 사람이 품질을 확인하는 단계로 만든다.
    takeaways:
      - "자연어 요청은 검증 가능한 `blueprint.yaml`로 남는다"
      - 같은 구조를 teal, vivid, modern preset으로 재생성할 수 있다
      - showcase deck 자체가 public release 전 proof artifact가 된다

  - id: appendix
    type: appendix
    title: Regeneration commands
    section_label: "APPENDIX"
    body:
      - |
        ```bash
        BP=examples/results/showcase-teal-dark.blueprint.yaml
        OUT=examples/results/showcase-teal-dark.pptx
        PDF=examples/results/showcase-teal-dark.pdf
        npm run validate -- --blueprint "$BP"
        npm run deck -- --blueprint "$BP" --output "$OUT"
        npm run export-pdf -- "$OUT" --out "$PDF"
        npm run preview -- "$OUT" --out temp/showcase-teal-preview --dpi 120
        ```
      - "vivid/modern 결과물은 같은 명령에서 파일명과 `--out` 경로만 바꿔 재생성한다."
      - "이 slide는 최근 추가한 fenced code box와 syntax highlighting을 실제 showcase 안에서 보여준다."

  - id: closing
    type: closing
    title: From prompt to proof artifact
    subtitle: AI가 만든 초안을 넘어, 재생성 가능하고 편집 가능한 presentation system으로 남긴다
    message: ai-deck-compiler showcase
