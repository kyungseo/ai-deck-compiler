deck:
  title: Q2 2026 Business Review
  design: default-modern
  theme: dark
  version: "1.0"
  audience: Business Stakeholders

slides:
  - id: kpis
    type: kpi
    title: Q2 2026 — Key Metrics
    kpis:
      - label: Revenue
        value: "$4.1M"
        delta: "+22% QoQ"
        trend: up
      - label: New Customers
        value: "87"
        delta: "+14% QoQ"
        trend: up
      - label: Churn Rate
        value: "1.8%"
        delta: "-0.3% QoQ"
        trend: down
      - label: Gross Margin
        value: "71%"
        delta: "+2% QoQ"
        trend: up

  - id: revenue-trend
    type: chart
    title: Revenue Trend — Last 6 Quarters
    chart:
      type: bar
      data:
        source: inline
        labels: ["Q1 2025", "Q2 2025", "Q3 2025", "Q4 2025", "Q1 2026", "Q2 2026"]
        series:
          - name: Revenue ($M)
            values: [2.1, 2.4, 2.7, 3.1, 3.4, 4.1]

  - id: segment-breakdown
    type: chart
    title: Revenue by Segment
    chart:
      type: line
      data:
        source: inline
        labels: ["Q1 2025", "Q2 2025", "Q3 2025", "Q4 2025", "Q1 2026", "Q2 2026"]
        series:
          - name: Enterprise ($M)
            values: [0.8, 1.0, 1.3, 1.7, 2.0, 2.6]
          - name: Self-serve ($M)
            values: [1.3, 1.4, 1.4, 1.4, 1.4, 1.5]

  - id: cohort-table
    type: table
    title: Cohort Retention — 2025 Annual Customers
    table:
      headers: ["Cohort", "Start MRR", "M3 Retention", "M6 Retention", "M12 Retention"]
      rows:
        - ["Q1 2025", "$124K", "92%", "87%", "81%"]
        - ["Q2 2025", "$148K", "94%", "89%", "83%"]
        - ["Q3 2025", "$167K", "95%", "91%", "—"]
        - ["Q4 2025", "$201K", "96%", "—", "—"]

  - id: summary
    type: summary
    title: Q2 Takeaways & Q3 Focus
    takeaways:
      - Enterprise segment now accounts for 63% of revenue — up from 38% a year ago
      - Self-serve stagnation confirms onboarding friction as the primary growth blocker
      - Retention improving across all cohorts; churn at lowest recorded level
      - Q3 priority — resolve self-serve conversion and accelerate enterprise onboarding
